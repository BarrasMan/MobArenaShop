# MobArenaTienda - arena shop
# Shop articles, the mystery box and the revive button.
# Texts accept '&' color codes.

tienda:               # shop
  titulo: "&6&lArena Shop"
  # Rows of the menu (1-6).
  filas: 5
  # Slot that shows how many coins you have (-1 to hide it).
  slot-info: 40
  # Item that fills the empty slots (AIR to leave them empty).
  relleno: GRAY_STAINED_GLASS_PANE

  # Every article:
  #   slot: position in the menu (0 = top left, 9 per row)
  #   material: Minecraft material name
  #   cantidad: (optional) amount, 1 by default
  #   precio: price in coins
  #   encantamientos: (optional) enchantment: level
  #   pocion: (optional, for POTION, SPLASH_POTION, LINGERING_POTION and TIPPED_ARROW)
  #           HEALING, STRONG_HEALING, REGENERATION, STRONG_REGENERATION, LONG_REGENERATION,
  #           STRENGTH, STRONG_STRENGTH, SWIFTNESS, STRONG_SWIFTNESS, FIRE_RESISTANCE,
  #           NIGHT_VISION, INVISIBILITY, LEAPING, SLOW_FALLING, TURTLE_MASTER...
  #   nombre: (optional) custom name
  # Armor pieces are equipped automatically if that armor slot is empty.
  articulos:
    # --- Weapons (max survival enchantments) ---
    iron_sword:
      slot: 10
      material: IRON_SWORD
      precio: 20
      encantamientos:
        sharpness: 5
        fire_aspect: 2
        knockback: 2
        looting: 3
        sweeping_edge: 3
        unbreaking: 3
        mending: 1
    diamond_sword:
      slot: 11
      material: DIAMOND_SWORD
      precio: 40
      encantamientos:
        sharpness: 5
        fire_aspect: 2
        knockback: 2
        looting: 3
        sweeping_edge: 3
        unbreaking: 3
        mending: 1
    netherite_sword:
      slot: 12
      material: NETHERITE_SWORD
      precio: 70
      encantamientos:
        sharpness: 5
        fire_aspect: 2
        knockback: 2
        looting: 3
        sweeping_edge: 3
        unbreaking: 3
        mending: 1
    bow:
      slot: 13
      material: BOW
      precio: 25
      # Infinity can't be combined with Mending; with Infinity 1 arrow is enough.
      encantamientos:
        power: 5
        punch: 2
        flame: 1
        infinity: 1
        unbreaking: 3
    arrows:
      slot: 14
      material: ARROW
      cantidad: 16
      precio: 3
    shield:
      slot: 15
      material: SHIELD
      precio: 12
      encantamientos:
        unbreaking: 3
        mending: 1

    # --- Iron armor (max survival enchantments) ---
    iron_helmet:
      slot: 19
      material: IRON_HELMET
      precio: 15
      encantamientos:
        protection: 4
        unbreaking: 3
        mending: 1
        respiration: 3
        aqua_affinity: 1
    iron_chestplate:
      slot: 20
      material: IRON_CHESTPLATE
      precio: 25
      encantamientos:
        protection: 4
        unbreaking: 3
        mending: 1
        thorns: 3
    iron_leggings:
      slot: 21
      material: IRON_LEGGINGS
      precio: 20
      encantamientos:
        protection: 4
        unbreaking: 3
        mending: 1
        swift_sneak: 3
    iron_boots:
      slot: 22
      material: IRON_BOOTS
      precio: 14
      encantamientos:
        protection: 4
        unbreaking: 3
        mending: 1
        feather_falling: 4
        depth_strider: 3
        soul_speed: 3

    # --- Diamond armor (max survival enchantments) ---
    diamond_helmet:
      slot: 28
      material: DIAMOND_HELMET
      precio: 35
      encantamientos:
        protection: 4
        unbreaking: 3
        mending: 1
        respiration: 3
        aqua_affinity: 1
    diamond_chestplate:
      slot: 29
      material: DIAMOND_CHESTPLATE
      precio: 55
      encantamientos:
        protection: 4
        unbreaking: 3
        mending: 1
        thorns: 3
    diamond_leggings:
      slot: 30
      material: DIAMOND_LEGGINGS
      precio: 45
      encantamientos:
        protection: 4
        unbreaking: 3
        mending: 1
        swift_sneak: 3
    diamond_boots:
      slot: 31
      material: DIAMOND_BOOTS
      precio: 30
      encantamientos:
        protection: 4
        unbreaking: 3
        mending: 1
        feather_falling: 4
        depth_strider: 3
        soul_speed: 3

    # --- Food ---
    golden_apple:
      slot: 16
      material: GOLDEN_APPLE
      precio: 5
    enchanted_golden_apple:
      slot: 25
      material: ENCHANTED_GOLDEN_APPLE
      precio: 50
    steak:
      slot: 34
      material: COOKED_BEEF
      cantidad: 8
      precio: 2

    # --- Potions (all splash) ---
    healing_potion:
      slot: 23
      material: SPLASH_POTION
      pocion: HEALING
      precio: 4
    strong_healing_potion:
      slot: 24
      material: SPLASH_POTION
      pocion: STRONG_HEALING
      precio: 7
    regeneration_potion:
      slot: 32
      material: SPLASH_POTION
      pocion: REGENERATION
      precio: 8
    strength_potion:
      slot: 33
      material: SPLASH_POTION
      pocion: STRENGTH
      precio: 10
    swiftness_potion:
      slot: 37
      material: SPLASH_POTION
      pocion: SWIFTNESS
      precio: 6
    fire_resistance_potion:
      slot: 43
      material: SPLASH_POTION
      pocion: FIRE_RESISTANCE
      precio: 6

# Mystery box: bought in the shop and opened right away with a spinning roulette.
# It doesn't exist as an item: it can only be opened from the shop. If the player closes
# the roulette before it stops, they still get the prize.
caja-misteriosa:      # mystery box
  activado: true      # enabled
  precio: 100         # price
  # Slot in the shop (can't be the same as an article, slot-info or the revive button).
  slot: 41
  material: ENDER_CHEST
  nombre: "&d&lMystery Box?"
  lore:
    - "&7Weapons and armor with"
    - "&7impossible enchantments."
    - ""
    - "&9Rare &8· &5Epic &8· &6&lLegendary"
  titulo: "&5&lMystery Box"
  # false = the prize is given instantly, without the roulette.
  animacion: true
  # Prizes: same format as the shop articles (material, encantamientos, nombre...) plus:
  #   peso: weight, how likely it is (higher = more often)
  #   rareza: rarity text shown under the name
  #   anunciar: true to tell the whole team when someone gets it
  # The weights add up to 100, so each weight is its % chance:
  # Rare 55% (13.75% each), Epic 35% (8.75% each), Legendary 10% (~3.33% each).
  premios:
    # --- Rare ---
    sharp_sword:
      material: DIAMOND_SWORD
      nombre: "&9Sharp Sword"
      rareza: "&9Rare"
      peso: 13.75
      encantamientos:
        sharpness: 10
        unbreaking: 5
    blazing_sword:
      material: IRON_SWORD
      nombre: "&9Blazing Sword"
      rareza: "&9Rare"
      peso: 13.75
      encantamientos:
        sharpness: 6
        fire_aspect: 10
    reinforced_leggings:
      material: DIAMOND_LEGGINGS
      nombre: "&9Reinforced Leggings"
      rareza: "&9Rare"
      peso: 13.75
      encantamientos:
        protection: 8
        unbreaking: 5
    bouncy_boots:
      material: DIAMOND_BOOTS
      nombre: "&9Bouncy Boots"
      rareza: "&9Rare"
      peso: 13.75
      encantamientos:
        protection: 8
        feather_falling: 10
        depth_strider: 3

    # --- Epic ---
    executioner_axe:
      material: DIAMOND_AXE
      nombre: "&5Executioner's Axe"
      rareza: "&5Epic"
      peso: 8.75
      encantamientos:
        sharpness: 15
        unbreaking: 10
    storm_bow:
      material: BOW
      nombre: "&5Storm Bow"
      rareza: "&5Epic"
      peso: 8.75
      # With Infinity, 1 arrow is enough (they are sold in the shop).
      encantamientos:
        power: 15
        punch: 5
        flame: 1
        infinity: 1
    guardian_helmet:
      material: DIAMOND_HELMET
      nombre: "&5Guardian's Helmet"
      rareza: "&5Epic"
      peso: 8.75
      encantamientos:
        protection: 10
        respiration: 5
        unbreaking: 10
    gale_sword:
      material: DIAMOND_SWORD
      nombre: "&5Gale Sword"
      rareza: "&5Epic"
      peso: 8.75
      encantamientos:
        knockback: 10
        sharpness: 6
        unbreaking: 5

    # --- Legendary ---
    pusher_sword:
      material: NETHERITE_SWORD
      nombre: "&6&lPusher Sword"
      rareza: "&6&lLEGENDARY"
      peso: 3.33
      anunciar: true
      encantamientos:
        knockback: 15
        sharpness: 10
        fire_aspect: 5
        unbreaking: 10
    titan_chestplate:
      material: NETHERITE_CHESTPLATE
      nombre: "&6&lTitan's Chestplate"
      rareza: "&6&lLEGENDARY"
      peso: 3.33
      anunciar: true
      encantamientos:
        protection: 10
        thorns: 10
        unbreaking: 10
    excalibur:
      material: NETHERITE_SWORD
      nombre: "&c&lExcalibur"
      rareza: "&6&lLEGENDARY"
      peso: 3.33
      anunciar: true
      encantamientos:
        sharpness: 25
        fire_aspect: 5
        sweeping_edge: 10
        looting: 5
        unbreaking: 20
        mending: 1

# Revive teammates: a living player pays in the shop for a fallen teammate (who is
# spectating). The teammate comes back into the game, next to whoever paid and with
# their class kit, when the next wave starts, only if the payer is still alive.
# If the payer dies first, the revive is lost.
revivir:              # revive
  activado: true      # enabled
  precio: 50          # price
  # Slot of the button in the shop (can't be the same as an article or slot-info).
  slot: 4
